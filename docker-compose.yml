services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: detective-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: detective_db
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - detective-net

  # ===== FastAPI 后端 =====
  backend:
    build: ./backend
    container_name: detective-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-123456}@mysql:3306/detective_db
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_data
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - chroma_data:/app/chroma_data
      - ./models:/models
      - ./backend/skills:/app/skills
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - detective-net

  # ===== Vue 前端 (Nginx) =====
  frontend:
    build: ./frontend
    container_name: detective-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - detective-net

volumes:
  mysql_data:
  chroma_data:

networks:
  detective-net:
    driver: bridge
